<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tribunal des dilemmes — Tirage au sort</title>
<link rel="stylesheet" href="retro-base.css">
<style>
  /* ====== Sélecteur de langue ====== */
  .header-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .lang-switch { display: flex; gap: 6px; }
  .lang-switch button {
    border: 2px solid var(--retro-teal);
    background: transparent;
    color: var(--retro-teal);
    padding: 3px 12px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    font-size: 0.75rem;
  }
  .lang-switch button:hover { border-color: var(--retro-orange); }
  .lang-switch button[aria-pressed="true"] {
    background: var(--retro-teal);
    color: var(--retro-paper);
  }

  /* ====== Layout général ====== */
  .stage {
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    margin: 24px 0 32px;
    position: relative;
  }

  .deck {
    position: relative;
    width: 220px;
    height: 320px;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    transform-style: preserve-3d;
    transition: transform 600ms cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Dos de carte (motif rétro) */
  .card-back {
    background:
      repeating-linear-gradient(45deg, var(--retro-teal) 0 14px, #0e5e5e 14px 28px);
    border: 4px solid var(--retro-orange);
    box-shadow: 0 6px 0 rgba(0,0,0,.25), inset 0 0 0 4px var(--retro-paper);
  }
  .card-back::after {
    content: '⚖';
    font-size: 5rem;
    color: var(--retro-jaune);
    text-shadow: 0 0 0 2px var(--retro-ink);
    filter: drop-shadow(2px 2px 0 var(--retro-ink));
  }

  /* Face avant (prénom) */
  .card-front {
    background: var(--retro-paper);
    border: 4px solid var(--retro-teal);
    box-shadow: inset 0 0 0 3px var(--retro-orange);
    transform: rotateY(180deg);
    flex-direction: column;
    padding: 20px;
    text-align: center;
  }
  .card-front .num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--retro-orange);
    font-size: 0.8rem;
  }
  .card-front .name {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    color: var(--retro-teal);
    font-size: 2.4rem;
    line-height: 1;
    letter-spacing: 0.04em;
    margin-top: 12px;
  }
  .card-front .deco {
    margin-top: 18px;
    font-size: 2rem;
    color: var(--retro-jaune);
  }

  /* Etats animés */
  .card.flipped { transform: rotateY(180deg); }
  .card.lift { transform: translateY(-30px) rotateZ(0deg); }

  /* Empilage initial */
  .deck.idle .card:nth-child(1) { transform: translate(-2px, -3px) rotate(-3deg); }
  .deck.idle .card:nth-child(2) { transform: translate(2px, -1px) rotate(2deg); }
  .deck.idle .card:nth-child(3) { transform: translate(0px, 0px) rotate(0deg); }
  .deck.idle .card:nth-child(4) { transform: translate(-1px, 2px) rotate(-1deg); }
  .deck.idle .card:nth-child(5) { transform: translate(3px, 3px) rotate(3deg); }

  /* Animation de mélange */
  @keyframes shuffle1 {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(-180px, -40px) rotate(-25deg); }
    50%  { transform: translate(160px, 30px) rotate(20deg); }
    75%  { transform: translate(-90px, 50px) rotate(-12deg); }
    100% { transform: translate(-2px, -3px) rotate(-3deg); }
  }
  @keyframes shuffle2 {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(170px, -30px) rotate(22deg); }
    50%  { transform: translate(-150px, 50px) rotate(-18deg); }
    75%  { transform: translate(120px, -60px) rotate(15deg); }
    100% { transform: translate(2px, -1px) rotate(2deg); }
  }
  @keyframes shuffle3 {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(-140px, 60px) rotate(-20deg); }
    50%  { transform: translate(140px, -50px) rotate(18deg); }
    75%  { transform: translate(-60px, -40px) rotate(-8deg); }
    100% { transform: translate(0,0) rotate(0); }
  }
  @keyframes shuffle4 {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(150px, 50px) rotate(15deg); }
    50%  { transform: translate(-170px, -40px) rotate(-22deg); }
    75%  { transform: translate(80px, 60px) rotate(10deg); }
    100% { transform: translate(-1px, 2px) rotate(-1deg); }
  }
  @keyframes shuffle5 {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(-160px, -50px) rotate(-18deg); }
    50%  { transform: translate(180px, 40px) rotate(25deg); }
    75%  { transform: translate(-100px, 30px) rotate(-10deg); }
    100% { transform: translate(3px, 3px) rotate(3deg); }
  }
  .deck.shuffling .card:nth-child(1) { animation: shuffle1 1.4s cubic-bezier(.4,.1,.3,1); }
  .deck.shuffling .card:nth-child(2) { animation: shuffle2 1.4s cubic-bezier(.4,.1,.3,1); }
  .deck.shuffling .card:nth-child(3) { animation: shuffle3 1.4s cubic-bezier(.4,.1,.3,1); }
  .deck.shuffling .card:nth-child(4) { animation: shuffle4 1.4s cubic-bezier(.4,.1,.3,1); }
  .deck.shuffling .card:nth-child(5) { animation: shuffle5 1.4s cubic-bezier(.4,.1,.3,1); }

  /* Carte tirée (saut + flip) */
  @keyframes drawn {
    0%   { transform: translateY(0) rotate(0); }
    35%  { transform: translateY(-60px) rotate(-4deg) scale(1.05); }
    70%  { transform: translateY(-50px) rotate(3deg) rotateY(180deg) scale(1.05); }
    100% { transform: translateY(0) rotate(0) rotateY(180deg) scale(1.08); }
  }
  .card.drawn { animation: drawn 1.2s cubic-bezier(.2,.7,.3,1) forwards; z-index: 10; }

  /* ====== Contrôles ====== */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-top: 12px;
  }

  .retro-btn-pill { background: transparent; font: inherit; }
  .retro-btn-pill:disabled { opacity: 0.5; cursor: not-allowed; }
  .retro-btn-pill.secondary { border-color: var(--retro-orange); }
  .retro-btn-pill.secondary .label { background: var(--retro-paper); color: var(--retro-ink); }
  .retro-btn-pill.secondary .icon  { background: var(--retro-teal); }

  /* ====== Compteur ====== */
  .counter {
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--retro-teal);
    font-size: 0.85rem;
    margin-top: 24px;
  }
  .counter span { color: var(--retro-orange); font-size: 1.1rem; }

  /* ====== Panneau du cas ====== */
  .case-panel {
    margin-top: 40px;
    background: var(--retro-paper);
    border: 3px solid var(--retro-teal);
    border-radius: 24px 8px 24px 8px;
    box-shadow: 6px 6px 0 var(--retro-orange);
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 500ms ease, transform 500ms ease;
    pointer-events: none;
  }
  .case-panel.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .case-header {
    background: var(--retro-ink);
    padding: 22px 28px;
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .case-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--retro-teal), var(--retro-orange), var(--retro-jaune));
  }
  .case-num-badge {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    background: var(--retro-orange);
    color: var(--retro-paper);
    padding: 6px 16px;
    border-radius: 50px;
  }
  .case-title {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    color: var(--retro-paper);
    font-size: 1.6rem;
    line-height: 1.1;
    letter-spacing: 0.04em;
    flex: 1;
    min-width: 200px;
  }
  .case-name-tag {
    font-family: 'Oswald', sans-serif;
    color: var(--retro-jaune);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.85rem;
  }

  .case-body {
    padding: 28px 32px;
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--retro-ink);
  }
  .case-body p { margin-bottom: 12px; }
  .case-body ul { margin: 12px 0 12px 24px; }
  .case-body li { margin-bottom: 8px; }

  .case-actions {
    display: flex;
    gap: 12px;
    padding: 0 32px 28px;
    flex-wrap: wrap;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--retro-teal);
    color: var(--retro-paper);
    padding: 12px 24px;
    border-radius: 50px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.85rem;
    box-shadow: 4px 4px 0 var(--retro-orange);
    transition: transform 400ms cubic-bezier(.2,.8,.2,1);
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--retro-teal);
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  @media (max-width: 600px) {
    .header-side { align-items: flex-start; }
    .deck { width: 180px; height: 260px; }
    .card-back::after { font-size: 3.6rem; }
    .card-front .name { font-size: 1.8rem; }
    .case-body { padding: 20px; font-size: 0.98rem; }
    .case-actions { padding: 0 20px 20px; }
  }
</style>
</head>
<body>
  <div class="page-frame">
    <header class="header-band">
      <div>
        <h1 class="page-title" data-i18n="heading">Tribunal des dilemmes</h1>
        <p class="page-subtitle" data-i18n="subtitle">Tirage au sort des cas pratiques</p>
      </div>
      <div class="header-side">
        <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="badge-seq" data-i18n="badge">Séquence 2 — Partie B</span>
      </div>
    </header>

    <div class="stage">
      <div class="deck idle" id="deck">
        <div class="card"><div class="card-face card-back"></div><div class="card-face card-front"><span class="num"></span><span class="name"></span><span class="deco">⚖</span></div></div>
        <div class="card"><div class="card-face card-back"></div><div class="card-face card-front"><span class="num"></span><span class="name"></span><span class="deco">⚖</span></div></div>
        <div class="card"><div class="card-face card-back"></div><div class="card-face card-front"><span class="num"></span><span class="name"></span><span class="deco">⚖</span></div></div>
        <div class="card"><div class="card-face card-back"></div><div class="card-face card-front"><span class="num"></span><span class="name"></span><span class="deco">⚖</span></div></div>
        <div class="card"><div class="card-face card-back"></div><div class="card-face card-front"><span class="num"></span><span class="name"></span><span class="deco">⚖</span></div></div>
      </div>
    </div>

    <div class="controls">
      <button class="retro-btn-pill" id="drawBtn">
        <span class="label">Tirer un cas</span>
        <span class="icon">🎴</span>
      </button>
      <button class="retro-btn-pill secondary" id="resetBtn">
        <span class="label" data-i18n="reset">Réinitialiser le paquet</span>
        <span class="icon">↻</span>
      </button>
    </div>

    <p class="counter"><span data-i18n="remaining" class="counter-label">Cartes restantes :</span> <span id="remaining">20</span> / <span id="total">20</span></p>

    <article class="case-panel" id="casePanel">
      <header class="case-header">
        <span class="case-num-badge" id="caseNumBadge"></span>
        <h2 class="case-title" id="caseTitle"></h2>
        <span class="case-name-tag" id="caseNameTag"></span>
      </header>
      <div class="case-body" id="caseBody"></div>
      <div class="case-actions">
        <button class="retro-btn-pill" id="copyBtn">
          <span class="label" data-i18n="copy">Copier le cas</span>
          <span class="icon">📋</span>
        </button>
      </div>
    </article>
  </div>

  <div class="toast" id="toast">Copié dans le presse-papier</div>

<script>
const CASES = [
  {
    n: 1,
    name: "Mireille",
    title: "Le bulletin rédigé par l'IA",
    body: "<p>Mireille enseigne depuis huit ans à des classes de 4e primaire. Cette année, elle a 28 élèves et chaque période de bulletins lui prend trois soirées entières — elle finit souvent à minuit, fatiguée, à recopier des formules qu'elle a l'impression d'avoir déjà écrites cent fois. Au mois de novembre, une collègue lui parle de ChatGPT.</p><p>Désormais, Mireille tape ses notes manuscrites pour chaque élève (« attentif mais lent en lecture », « progrès en math, agité en groupe », « élève fragile, manque de confiance ») et demande à l'IA de les transformer en commentaires de bulletin. Elle relit, ajuste un mot ici, ajoute une nuance là, valide. En deux heures, les 28 commentaires sont prêts.</p><p>Aux réunions de parents, plusieurs familles la félicitent : « On voit que vous connaissez vraiment notre fils, vos commentaires sont si justes. » L'année précédente, certains parents s'étaient plaints du manque de personnalisation. Mireille n'a parlé de sa nouvelle méthode à personne — pas même à la direction, pas même à son binôme.</p>"
  },
  {
    n: 2,
    name: "Thomas",
    title: "Le plan d'intervention généré en deux minutes",
    body: "<p>Thomas est professeur référent pour les élèves à besoins spécifiques dans un grand établissement secondaire. Il suit 47 dossiers cette année, en plus de ses heures de cours. Une nouvelle élève vient d'arriver : Émilie, 13 ans, diagnostiquée dyslexique sévère par la logopède du centre PMS. Le rapport fait six pages denses.</p><p>Le règlement impose un Plan Individuel d'Apprentissage rédigé et signé sous quinze jours. Thomas est déjà en retard sur quatre autres dossiers. Il copie-colle le diagnostic dans une IA et lui demande de produire un PIA complet : objectifs pédagogiques, aménagements, modalités d'évaluation, suivi trimestriel, recommandations aux enseignants de chaque discipline.</p><p>Le document généré est structuré, professionnel, parfaitement conforme à la trame officielle de la Fédération. Thomas le parcourt rapidement, modifie deux phrases, signe et l'envoie à la direction et aux parents. Le PIA porte son nom. Il l'engage juridiquement face à la famille, à l'établissement et à l'inspection.</p>"
  },
  {
    n: 3,
    name: "Samira",
    title: "L'IA décide qui a triché",
    body: "<p>Samira, 17 ans, élève en 6e secondaire, rend une dissertation de français sur Zola. Elle y a consacré trois soirées, en s'aidant d'un manuel de référence et de ses notes de cours. Le travail est soigné, bien construit, le vocabulaire est riche — Samira est une bonne élève, lectrice depuis l'enfance.</p><p>L'établissement vient de souscrire à un outil de détection automatique de contenus IA. Le travail de Samira est analysé : score de 87 % de probabilité « généré par IA ». La professeure de français convoque Samira dès le lendemain matin, lui montre la capture d'écran du rapport, et lui annonce un zéro pour le travail ainsi qu'une mention au dossier disciplinaire.</p><p>Samira proteste, jure n'avoir utilisé aucune IA, propose de réécrire la dissertation à la main, sur place, devant la professeure. Celle-ci refuse : « L'outil ne se trompe presque jamais à ce niveau de score. » L'outil, lui, ne fournit aucune justification : juste un pourcentage, sans extraits surlignés, sans explication de méthode. Les parents de Samira demandent un rendez-vous avec la direction.</p>"
  },
  {
    n: 4,
    name: "Aïcha",
    title: "L'assistant pédagogique qui remplace l'accompagnement humain",
    body: "<p>L'école d'Aïcha souffre d'un manque chronique de personnel : trois départs non remplacés cette année, deux collègues en burn-out. La direction signe un contrat avec une start-up qui propose un chatbot pédagogique disponible 24h/24, accessible aux élèves de terminale via leurs smartphones. Coût : 8 € par élève par mois, à charge de l'établissement. L'outil répond aux questions de math, physique, français, langues.</p><p>Aïcha enseigne les mathématiques en 6e secondaire. Au début, elle est sceptique mais accepte. Trois mois plus tard, elle constate un changement net : plus aucune main ne se lève en cours. Quand elle propose des moments de questions, le silence s'installe. Une élève lui dit franchement : « C'est plus simple de demander au bot, madame, il ne juge pas, il répond tout de suite, et il est patient quand je redemande dix fois. »</p><p>Les notes restent stables. La direction parle d'une « expérience réussie » et envisage d'étendre le dispositif aux 5e. Aïcha se demande ce qu'elle voit disparaître exactement, et si ce qui disparaît a un nom.</p>"
  },
  {
    n: 5,
    name: "Yannick",
    title: "La lettre de motivation pour l'élève",
    body: "<p>Yannick, professeur de français en 6e secondaire, accompagne chaque année ses élèves dans la rédaction de leur lettre de motivation pour l'enseignement supérieur. La plupart de ses élèves viennent de milieux où personne dans la famille n'a fréquenté l'université ; certains n'ont jamais écrit de courrier formel.</p><p>Cette année, il innove. Il fait remplir à chaque élève un formulaire détaillé (parcours, motivations, projet, anecdotes personnelles), puis injecte ces informations dans une IA pour produire une première version. Il imprime cette version, s'assoit avec l'élève une demi-heure, et retravaille phrase par phrase : « ce mot ne te ressemble pas », « cette tournure est trop pompeuse », « raconte plutôt comme tu me l'as dit hier ».</p><p>Les lettres finales sont solides. Plusieurs élèves obtiennent des places dans des filières sélectives. Aucune mention de l'IA n'apparaît dans les courriers envoyés aux universités et hautes écoles, ni dans les déclarations sur l'honneur que les élèves ont signées attestant que la lettre est « rédigée personnellement ».</p>"
  },
  {
    n: 6,
    name: "Sandrine",
    title: "Le cours « augmenté » sans le dire",
    body: "<p>Sandrine enseigne l'histoire en secondaire depuis 12 ans. Depuis un an, elle prépare la quasi-totalité de ses cours avec une IA : synthèses thématiques, chronologies, frises, cartes mentales, banques de questions de compréhension, scénarios pédagogiques différenciés selon les niveaux. Elle vérifie systématiquement les dates et les faits, croise avec ses manuels universitaires.</p><p>Ses élèves disent que ses cours sont parmi les plus clairs de leur scolarité ; les évaluations PIA de l'établissement la placent en tête du département. En réunion d'équipe, ses collègues lui demandent comment elle fait pour produire autant de matériel de qualité. Elle répond qu'elle « travaille beaucoup » et change de sujet.</p><p>Lors d'une formation interne sur l'IA, un collègue affirme devant la salle que « les enseignants qui utilisent l'IA en cachette manquent de courage professionnel ». Sandrine ne réagit pas. Elle se demande si déclarer son usage en pleine salle des profs serait du courage ou de l'imprudence — plusieurs collègues plus âgés y voient ouvertement de la triche.</p>"
  },
  {
    n: 7,
    name: "Pierre",
    title: "L'image générée présentée comme authentique",
    body: "<p>Pierre prépare une séquence sur la Seconde Guerre mondiale en 4e secondaire. Pour illustrer le chapitre sur l'exode et les déplacements de populations, il cherche en vain une photographie d'archive qui correspond exactement à l'angle qu'il veut traiter : une famille en marche, vue de dos, route de campagne, automne. Il finit par générer l'image avec un outil IA : noir et blanc, vêtements d'époque, valises en carton, expressions graves, lumière rasante.</p><p>L'image est saisissante. Pierre la projette pendant le cours sans préciser son origine. Plusieurs élèves prennent des notes, l'un d'eux la photographie avec son téléphone et la partage dans le groupe de classe. Lors de l'évaluation deux semaines plus tard, deux élèves citent l'image dans leur travail comme « source photographique de la période », l'un d'eux en l'attribuant même à un photographe inventé.</p><p>Quand Pierre s'en rend compte à la correction, il hésite. Le cours suivant, il se contente de mettre un commentaire dans la marge des copies, sans aborder la question en classe.</p>"
  },
  {
    n: 8,
    name: "Joëlle",
    title: "L'évaluation corrompue par l'IA à l'insu de l'élève",
    body: "<p>Joëlle corrige chaque semaine une trentaine de productions écrites en français, en 5e secondaire. Pour gagner du temps et « se rassurer », elle a pris l'habitude de soumettre chaque copie à une IA en lui demandant : « Évalue ce travail sur 20, justifie en trois lignes, identifie les forces et les faiblesses. »</p><p>Elle compare ensuite avec son intuition. Quand l'IA suggère 12 et qu'elle pensait à 14, elle se range souvent à l'avis de l'IA — « après tout, elle a peut-être vu quelque chose que j'ai manqué ». En quelques mois, elle se rend compte qu'elle ne décide plus vraiment seule : ses notes finales s'alignent dans 80 % des cas sur l'évaluation algorithmique.</p><p>Aucun élève, aucun parent, aucun collègue n'est au courant. Sur les bulletins, c'est sa signature qui apparaît, et la note est présentée comme le fruit de son jugement professionnel. Quand un parent conteste une note, c'est elle qui défend l'évaluation — sans dire qu'elle s'appuie sur une analyse qu'elle n'a pas produite.</p>"
  },
  {
    n: 9,
    name: "Catherine",
    title: "L'avantage invisible",

// Langue de départ : ?lang=en dans l'adresse, sinon le français.
function langueInitiale() {
  try {
    const p = new URLSearchParams(location.search).get('lang');
    if (p === 'fr' || p === 'en') return p;
  } catch { /* adresse illisible : français */ }
  return 'fr';
}

let lang = langueInitiale();
function ui() { return UI[lang]; }
function texteCas(c) {
  const tr = lang === 'en' ? CASES_EN[c.n] : null;
  return { title: (tr && tr.title) || c.title, body: (tr && tr.body) || c.body };
}

const STORAGE_KEY = "tribunal_drawn_cases_v1";

const deck = document.getElementById('deck');
const drawBtn = document.getElementById('drawBtn');
const resetBtn = document.getElementById('resetBtn');
const remainingEl = document.getElementById('remaining');
const totalEl = document.getElementById('total');
const panel = document.getElementById('casePanel');
const caseNumBadge = document.getElementById('caseNumBadge');
const caseTitle = document.getElementById('caseTitle');
const caseNameTag = document.getElementById('caseNameTag');
const caseBody = document.getElementById('caseBody');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');

function loadDrawn() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}
function saveDrawn(set) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch {}
}

let drawn = loadDrawn();
let isAnimating = false;
let lastCase = null;

function getRemaining() {
  return CASES.filter(c => !drawn.has(c.n));
}

function updateCounter() {
  const r = getRemaining().length;
  remainingEl.textContent = r;
  totalEl.textContent = CASES.length;
  if (r === 0) {
    drawBtn.disabled = true;
    drawBtn.querySelector('.label').textContent = ui().empty;
  } else {
    drawBtn.disabled = isAnimating;
    drawBtn.querySelector('.label').textContent = ui().draw;
  }
}

function pickRandom() {
  const remaining = getRemaining();
  if (remaining.length === 0) return null;
  return remaining[Math.floor(Math.random() * remaining.length)];
}

function setFrontCard(card, c) {
  const front = card.querySelector('.card-front');
  front.querySelector('.num').textContent = ui().caseNum(c.n);
  front.querySelector('.name').textContent = c.name;
}

function resetDeckVisual() {
  panel.classList.remove('visible');
  [...deck.querySelectorAll('.card')].forEach(card => {
    card.classList.remove('flipped', 'drawn');
    card.style.animation = '';
  });
  deck.classList.remove('shuffling');
  deck.classList.add('idle');
}

async function draw() {
  if (isAnimating) return;
  const c = pickRandom();
  if (!c) return;

  isAnimating = true;
  drawBtn.disabled = true;
  panel.classList.remove('visible');

  resetDeckVisual();

  // Préparer la face avant de la carte du dessus (la 5e = au-dessus de la pile)
  const cards = [...deck.querySelectorAll('.card')];
  const topCard = cards[cards.length - 1];
  setFrontCard(topCard, c);

  // Mélange
  deck.classList.remove('idle');
  deck.classList.add('shuffling');
  await wait(1400);
  deck.classList.remove('shuffling');
  deck.classList.add('idle');
  await wait(120);

  // Tirage de la carte du dessus
  topCard.classList.add('drawn');
  await wait(1200);

  // Marquer comme tirée + afficher le panneau
  drawn.add(c.n);
  saveDrawn(drawn);
  lastCase = c;
  showCase(c);

  isAnimating = false;
  updateCounter();
}

function showCase(c) {
  const t = texteCas(c);
  caseNumBadge.textContent = ui().caseNum(c.n);
  caseTitle.textContent = t.title;
  caseNameTag.textContent = `★ ${c.name}`;
  caseBody.innerHTML = t.body;
  requestAnimationFrame(() => panel.classList.add('visible'));
}

function buildCopyText(c) {
  const t = texteCas(c);
  const tmp = document.createElement('div');
  tmp.innerHTML = t.body;
  // Convertir en texte brut lisible
  tmp.querySelectorAll('li').forEach(li => { li.textContent = '• ' + li.textContent; });
  const plain = tmp.innerText.replace(/\n{3,}/g, '\n\n').trim();
  return `${ui().copyHead(ui().caseNum(c.n), t.title)}\n\n${plain}`;
}

async function copyCase() {
  if (!lastCase) return;
  const text = buildCopyText(lastCase);
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
  }
  showToast(ui().copied);
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

function reset() {
  drawn = new Set();
  saveDrawn(drawn);
  lastCase = null;
  resetDeckVisual();
  updateCounter();
  showToast(ui().resetDone);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

drawBtn.addEventListener('click', draw);
resetBtn.addEventListener('click', reset);
copyBtn.addEventListener('click', copyCase);

// Change la langue et redessine les textes : le paquet et le cas affiché restent en place.
function appliquerLangue(l) {
  lang = l;
  document.documentElement.lang = l;
  document.title = ui().pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = ui()[el.dataset.i18n]; });
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === l));
  });
  updateCounter();
  if (lastCase) {
    const cards = [...deck.querySelectorAll('.card')];
    setFrontCard(cards[cards.length - 1], lastCase);
    showCase(lastCase);
  }
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    appliquerLangue(b.dataset.lang);
    try {
      const u = new URL(location.href);
      u.searchParams.set('lang', lang);
      history.replaceState(null, '', u);
    } catch { /* fichier local : la langue vaut pour la session */ }
  });
});

appliquerLangue(lang);
</script>
</body>
</html>
